<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#315efb"><title>N빵 정산</title><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script><style>
:root{--b:#f3f5f9;--c:#fff;--i:#172033;--m:#747d8d;--p:#315efb;--l:#e3e7ee;--g:#16845d;--r:#d34b4b}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--i);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;padding:env(safe-area-inset-top) 15px 35px}header{max-width:720px;margin:auto;padding:20px 4px 15px;display:flex;justify-content:space-between;align-items:center}h1{margin:2px 0;font-size:28px}.brand{display:flex;align-items:center;gap:8px}.ver{font-size:11px;font-weight:850;color:var(--p);background:#e8edff;padding:4px 7px;border-radius:99px}.ey{margin:0;color:var(--p);font-size:11px;font-weight:900;letter-spacing:1.5px}main{max-width:720px;margin:auto}.card,.item,#sheet{background:var(--c);border-radius:20px;box-shadow:0 10px 30px #1d2d4d12}.summary{display:grid;grid-template-columns:repeat(3,1fr);padding:17px 5px}.summary div{text-align:center;border-right:1px solid var(--l)}.summary div:last-child{border:0}.summary span,.summary b{display:block}.summary span{font-size:11px;color:var(--m);margin-bottom:6px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:#e2e7ef;border-radius:13px;padding:4px;margin:15px 0}.tabs button{border:0;background:none;padding:11px 2px;border-radius:10px;font-weight:800;color:var(--m)}.tabs .on{background:#fff;color:var(--i)}.panel{display:none}.panel.on{display:block}.btn{width:100%;border:0;border-radius:13px;min-height:48px;font-size:15px;font-weight:850;margin-bottom:10px;background:var(--p);color:white}.sub{background:#e8edff;color:var(--p)}.section{display:flex;justify-content:space-between;align-items:end;margin:20px 2px 10px}.section h2{margin:0;font-size:20px}.section p{margin:4px 0;color:var(--m);font-size:12px}.list{display:grid;gap:9px}.item{padding:14px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.copy{flex:1;min-width:0}.copy b,.copy small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.copy small,.amt small{color:var(--m);margin-top:4px}.amt{text-align:right}.actions{border-top:1px solid var(--l);margin-top:11px;padding-top:10px}.mini{border:0;border-radius:8px;padding:7px 10px;margin-right:5px;font-weight:700}.danger{color:var(--r)}.empty{text-align:center;color:var(--m);background:#fff;border-radius:18px;padding:40px 10px}.add{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:12px}input,select{width:100%;border:1px solid #d7dce5;border-radius:11px;padding:12px;font-size:16px}label{display:block;font-size:13px;font-weight:800;margin:13px 0 6px}label input,label select{margin-top:6px}dialog{border:0;border-radius:22px;width:min(92vw,540px);max-height:88vh;overflow:auto;padding:20px}dialog::backdrop{background:#0f172a88}.dh{display:flex;justify-content:space-between;align-items:center}.x{border:0;background:#eef1f5;border-radius:50%;width:40px;height:40px}.upload{display:block;border:1px dashed #abb4c4;border-radius:12px;padding:13px;margin-top:6px;color:var(--p)}.upload input{display:none}.status{font-size:12px;background:#f0f3ff;padding:11px;border-radius:10px;margin-bottom:10px}.split{font-size:13px;background:#f0f3ff;padding:12px;border-radius:11px;margin:12px 0}#sheet{padding:21px;margin-bottom:12px}.sh{text-align:center;border-bottom:2px solid var(--i);padding-bottom:13px}.sh p{margin:0;color:var(--p);font-size:10px;font-weight:900;letter-spacing:1px}.sh h2{margin:5px}.sh small{color:var(--m)}.total,.bal,.send{display:flex;justify-content:space-between;align-items:center}.total{background:#f0f3ff;padding:15px;border-radius:13px;margin:16px 0}.total b{font-size:22px;color:var(--p)}#sheet h3{font-size:14px;margin:18px 0 5px}.bal{padding:10px 2px;border-bottom:1px solid var(--l)}.bal small{display:block;color:var(--m);margin-top:3px}.pos{color:var(--g)}.neg{color:var(--r)}.send{background:#f5f7fa;padding:12px;border-radius:10px;margin:6px 0}.arrow{color:var(--p);font-weight:900}.note{text-align:center;font-size:10px;color:var(--m);margin-top:18px}#receiptView{max-width:100%}.muted{opacity:.55}@media(max-width:390px){.summary b{font-size:14px}}
</style></head><body><header><div><p class="ey">GEORGIA HOUSE</p><div class="brand"><h1>N빵 정산</h1><span class="ver">v1.1.0</span></div></div><button class="x" id="setBtn">⚙️</button></header><main><section class="summary card"><div><span>공동 지출</span><b id="total">$0.00</b></div><div><span>현재 인원</span><b id="mc">0명</b></div><div><span>결제 내역</span><b id="ec">0건</b></div></section><nav class="tabs"><button class="on" data-p="pay">결제내역</button><button data-p="result">정산결과</button><button data-p="people">인원관리</button></nav>
<section id="pay" class="panel on"><button class="btn" id="addPay">＋ 새 결제 등록</button><div class="section"><h2>결제내역</h2></div><div id="pays" class="list"></div></section><section id="result" class="panel"><div id="sheet"><div class="sh"><p>GEORGIA HOUSE</p><h2 id="title">공동생활 정산서</h2><small id="period"></small></div><div class="total"><span>총 공동 지출</span><b id="st">$0.00</b></div><h3>사람별 현황</h3><div id="bals"></div><h3>이렇게 보내면 끝</h3><div id="sends"></div><p class="note">결제 당시 숙소 인원 기준으로 균등 분할했어요.</p></div><button class="btn" id="image">정산 결과 이미지로 저장</button><button class="btn sub" id="finish">정산 완료하고 새로 시작</button></section><section id="people" class="panel"><div class="section"><div><h2>숙소 인원</h2><p>사용할 때 직접 등록하면 돼.</p></div></div><form id="personForm" class="add"><input id="person" placeholder="이름 또는 별명" maxlength="20" required><button class="btn">추가</button></form><div id="persons" class="list"></div></section></main>
<dialog id="payDlg"><form id="payForm"><div class="dh"><h2>결제 등록</h2><button class="x" type="button" data-close>✕</button></div><label>결제한 사람<select id="payer"></select></label><label>영수증 사진<span class="upload"><input id="receipt" type="file" accept="image/*"><b id="fileName">사진 촬영·선택</b></span></label><button type="button" class="btn sub" id="scan" disabled>영수증 금액 자동 읽기</button><div id="scanStatus" class="status" hidden></div><label>결제금액 ($)<input id="amount" type="number" inputmode="decimal" step="0.01" min="0.01" required></label><label>결제일<input id="date" type="date" required></label><label>매장명<input id="store" maxlength="40" placeholder="예: Walmart"></label><label>구매내용<input id="memo" maxlength="80" placeholder="예: 식재료·생필품"></label><div class="split" id="split"></div><input id="editId" type="hidden"><button class="btn">저장</button></form></dialog>
<dialog id="settings"><div class="dh"><h2>설정·백업</h2><button class="x" data-close>✕</button></div><label>정산서 제목<input id="titleInput" maxlength="30"></label><button class="btn sub" id="backup">데이터 백업 저장</button><label class="upload"><input id="restore" type="file" accept="application/json"><b>백업 불러오기</b></label><p class="note">브라우저 데이터 삭제나 기기 변경 전에는 꼭 백업해줘.</p></dialog><dialog id="photo"><div class="dh"><h2>영수증</h2><button class="x" data-close>✕</button></div><img id="receiptView"></dialog>
<script>
const K='settlementV1',D={title:'조지아 숙소 공동생활 정산서',members:[],expenses:[],archives:[]};let S=load(),pic=null;const $=q=>document.querySelector(q),$$=q=>[...document.querySelectorAll(q)];function load(){try{return{...D,...JSON.parse(localStorage.getItem(K)||'{}')}}catch{return structuredClone(D)}}function save(){localStorage.setItem(K,JSON.stringify(S));render()}function cash(n){return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(+n||0)}function id(){return crypto.randomUUID?.()||Date.now()+''}function day(){return new Date().toISOString().slice(0,10)}function A(){return S.members.filter(x=>x.active)}function nm(i){return S.members.find(x=>x.id===i)?.name||'알 수 없음'}function safe(x=''){return x.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){let t=S.expenses.reduce((a,e)=>a+e.amount,0),ds=S.expenses.map(e=>e.date).sort();$('#total').textContent=$('#st').textContent=cash(t);$('#mc').textContent=A().length+'명';$('#ec').textContent=S.expenses.length+'건';$('#title').textContent=$('#titleInput').value=S.title;$('#period').textContent=ds.length?ds[0]+' ~ '+ds.at(-1):'등록된 내역 없음';$('#pays').innerHTML=S.expenses.length?S.expenses.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(e=>`<div class="item"><div class="row"><div>🧾</div><div class="copy"><b>${safe(e.store||e.memo||'공동 구매')}</b><small>${e.date} · ${safe(nm(e.payer))} · ${e.memberIds.length}명</small></div><div class="amt"><b>${cash(e.amount)}</b><small>1인 ${cash(e.amount/e.memberIds.length)}</small></div></div><div class="actions">${e.receipt?`<button class="mini" data-photo="${e.id}">영수증</button>`:''}<button class="mini" data-edit="${e.id}">수정</button><button class="mini danger" data-del="${e.id}">삭제</button></div></div>`).join(''):'<div class="empty">인원을 등록한 뒤 첫 결제를 추가해줘.</div>';$('#persons').innerHTML=S.members.length?S.members.map(m=>`<div class="item row ${m.active?'':'muted'}"><div><b>${safe(m.name)}</b><small>${m.active?'현재 생활 중':'퇴실'}</small></div><div><button class="mini" data-toggle="${m.id}">${m.active?'퇴실':'재입실'}</button><button class="mini" data-name="${m.id}">이름변경</button></div></div>`).join(''):'<div class="empty">이름은 지금 정하지 않아도 돼.<br>사용할 때 직접 추가해줘.</div>';settle();payers();split()}
function settle(){let b=new Map(S.members.map(m=>[m.id,{p:0,s:0}])),pairs=new Map;S.expenses.forEach(e=>{if(!b.has(e.payer))b.set(e.payer,{p:0,s:0});let cents=Math.round(e.amount*100),ids=[...e.memberIds],base=Math.floor(cents/ids.length),rem=cents-base*ids.length;b.get(e.payer).p+=cents;if(ids.includes(e.payer))ids=[e.payer,...ids.filter(i=>i!==e.payer)];ids.forEach((i,k)=>{let share=base+(k<rem?1:0);if(!b.has(i))b.set(i,{p:0,s:0});b.get(i).s+=share;if(i!==e.payer){let a=[i,e.payer].sort(),key=a.join('|'),sign=i===a[0]?1:-1;pairs.set(key,(pairs.get(key)||0)+sign*share)}})});let tx=[];for(let[key,v]of pairs){if(!v)continue;let[a,z]=key.split('|');tx.push(v>0?{f:a,t:z,a:v/100}:{f:z,t:a,a:-v/100})}tx.sort((x,y)=>y.a-x.a);let rows=[...b].filter(([_,v])=>v.p||v.s);$('#bals').innerHTML=rows.length?rows.map(([i,v])=>{let n=(v.p-v.s)/100;return`<div class="bal"><div><b>${safe(nm(i))}</b><small>결제 ${cash(v.p/100)} · 부담 ${cash(v.s/100)}</small></div><b class="${n>=0?'pos':'neg'}">${n>=0?'+':''}${cash(n)}</b></div>`}).join(''):'<div class="empty">결제내역을 등록하면 계산돼.</div>';$('#sends').innerHTML=tx.length?tx.map(x=>`<div class="send"><b>${safe(nm(x.f))}</b><span class="arrow">→ ${cash(x.a)} →</span><b>${safe(nm(x.t))}</b></div>`).join(''):(S.expenses.length?'<div class="empty">서로 주고받을 차액이 없어. 정산 완료!</div>':'<div class="empty">정산할 내역이 없어.</div>')}
function payers(){let v=$('#payer').value;$('#payer').innerHTML=A().map(m=>`<option value="${m.id}">${safe(m.name)}</option>`).join('');if(A().some(m=>m.id===v))$('#payer').value=v}function split(){let n=A().length,a=+$('#amount').value||0;$('#split').textContent=n?`현재 ${n}명이 각각 ${cash(a/n)}씩 부담해.`:'먼저 인원을 추가해줘.'}
$$('.tabs button').forEach(x=>x.onclick=()=>{$$('.tabs button,.panel').forEach(y=>y.classList.remove('on'));x.classList.add('on');$('#'+x.dataset.p).classList.add('on')});$$('[data-close]').forEach(x=>x.onclick=()=>x.closest('dialog').close());$('#setBtn').onclick=()=>$('#settings').showModal();$('#amount').oninput=split;$('#addPay').onclick=()=>{if(!A().length){$$('.tabs button')[2].click();return alert('먼저 인원을 추가해줘.')}$('#payForm').reset();$('#editId').value='';$('#date').value=day();pic=null;$('#fileName').textContent='사진 촬영·선택';$('#scan').disabled=true;$('#scanStatus').hidden=true;payers();split();$('#payDlg').showModal()};
$('#receipt').onchange=async e=>{let f=e.target.files[0];if(!f)return;$('#fileName').textContent=f.name;pic=await resize(f);$('#scan').disabled=false};async function resize(f){let u=URL.createObjectURL(f),im=new Image;await new Promise((r,j)=>{im.onload=r;im.onerror=j;im.src=u});let z=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*z;c.height=im.height*z;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);return c.toDataURL('image/jpeg',.7)}
$('#scan').onclick=async()=>{let s=$('#scanStatus');s.hidden=false;s.textContent='영수증 읽는 중…';$('#scan').disabled=true;try{let{data}=await Tesseract.recognize(pic,'eng',{logger:m=>{if(m.progress)s.textContent=`영수증 읽는 중… ${Math.round(m.progress*100)}%`}}),r=ocr(data.text);if(r.a)$('#amount').value=r.a.toFixed(2);if(r.date)$('#date').value=r.date;if(r.store&&!$('#store').value)$('#store').value=r.store;s.textContent=r.a?`인식 금액 ${cash(r.a)} — 꼭 확인해줘.`:'금액을 못 찾았어. 직접 입력해줘.';split()}catch{s.textContent='인식에 실패했어. 직접 입력해줘.'}finally{$('#scan').disabled=false}};
function ocr(text){let ls=text.split(/\n/).map(x=>x.trim()).filter(Boolean),q=[],p=/\b(grand\s*total|amount\s*(paid|due)?|balance\s*due|total)\b/i,x=/subtotal|tax|change|cash|tender/i;ls.forEach((l,i)=>[...l.matchAll(/\$?\s*(\d{1,4}(?:,\d{3})*\.\d{2})\b/g)].forEach(m=>q.push({a:+m[1].replace(',',''),s:(p.test(l)?10:0)-(x.test(l)?8:0)+i/ls.length})));q=q.filter(v=>v.a>0&&v.a<10000).sort((a,b)=>b.s-a.s||b.a-a.a);let d='',m=text.match(/\b(\d{1,2})[\/-](\d{1,2})[\/-](\d{2,4})\b/);if(m)d=`${m[3].length==2?'20'+m[3]:m[3]}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`;return{a:q[0]?.a||0,date:d,store:ls.find(l=>/[A-Za-z]{3}/.test(l)&&l.length<40)||''}}
$('#payForm').onsubmit=e=>{e.preventDefault();let old=S.expenses.find(x=>x.id===$('#editId').value),o={id:old?.id||id(),payer:$('#payer').value,amount:+$('#amount').value,date:$('#date').value,store:$('#store').value.trim(),memo:$('#memo').value.trim(),memberIds:old?.memberIds||A().map(x=>x.id),receipt:pic||old?.receipt||null};old?Object.assign(old,o):S.expenses.push(o);save();$('#payDlg').close()};$('#pays').onclick=e=>{let d=e.target.dataset;if(d.del&&confirm('삭제할까?')){S.expenses=S.expenses.filter(x=>x.id!==d.del);save()}if(d.photo){$('#receiptView').src=S.expenses.find(x=>x.id===d.photo).receipt;$('#photo').showModal()}if(d.edit){let x=S.expenses.find(x=>x.id===d.edit);$('#editId').value=x.id;payers();if(!A().some(m=>m.id===x.payer))$('#payer').innerHTML+=`<option value="${x.payer}">${safe(nm(x.payer))}</option>`;$('#payer').value=x.payer;$('#amount').value=x.amount;$('#date').value=x.date;$('#store').value=x.store;$('#memo').value=x.memo;pic=x.receipt;$('#fileName').textContent=pic?'기존 영수증 첨부됨':'사진 촬영·선택';$('#scan').disabled=!pic;split();$('#payDlg').showModal()}};
$('#personForm').onsubmit=e=>{e.preventDefault();let n=$('#person').value.trim();S.members.push({id:id(),name:n,active:true});$('#person').value='';save()};$('#persons').onclick=e=>{let d=e.target.dataset;if(d.toggle){let m=S.members.find(x=>x.id===d.toggle);m.active=!m.active;save()}if(d.name){let m=S.members.find(x=>x.id===d.name),n=prompt('새 이름',m.name)?.trim();if(n){m.name=n;save()}}};$('#image').onclick=async()=>{if(!S.expenses.length)return alert('내역이 없어.');let c=await html2canvas($('#sheet'),{scale:2,backgroundColor:'#fff'}),a=document.createElement('a');a.download=`정산서-${day()}.png`;a.href=c.toDataURL();a.click()};$('#finish').onclick=()=>{if(S.expenses.length&&confirm('현재 내역을 보관하고 새로 시작할까?')){S.archives.push({at:new Date().toISOString(),expenses:S.expenses});S.expenses=[];save()}};$('#titleInput').onchange=e=>{S.title=e.target.value.trim()||D.title;save()};$('#backup').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download=`정산백업-${day()}.json`;a.click()};$('#restore').onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(!Array.isArray(x.members)||!Array.isArray(x.expenses))throw 0;if(confirm('백업 내용으로 교체할까?')){S={...D,...x};save();$('#settings').close()}}catch{alert('올바른 백업 파일이 아니야.')}};render();
</script></body></html>
